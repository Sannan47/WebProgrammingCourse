<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Editor</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="filter-panel" id="filter-panel">
            <h2>Filters</h2>
            <div class="filter-tabs">
                <button class="tab-btn active" id="brightness-tab">Brightness</button>
                <button class="tab-btn" id="saturation-tab">Saturation</button>
                <button class="tab-btn" id="inversion-tab">Inversion</button>
                <button class="tab-btn" id="grayscale-tab">Grayscale</button>
                <button class="tab-btn" id="sepia-tab">Sepia</button>
                <button class="tab-btn" id="blur-tab">Blur</button>
            </div>
            <div class="slider-container">
                <label id="slider-label">Brightness 100%</label>
                <input type="range" id="slider" min="0" max="200" value="100" step="3">
            </div>
            <div class="rotate-flip">
                <h3>Rotate & Flip</h3>
                <div class="rotate-buttons">
                    <button id="rotate-left">↶</button>
                    <button id="rotate-right">↷</button>
                    <button id="flip-h">⇄</button>
                    <button id="flip-v">⇅</button>
                </div>
            </div>
            <div class="undo-redo">
                <button id="undo-btn" disabled>Undo</button>
                <button id="redo-btn" disabled>Redo</button>
            </div>
            <button class="reset-btn" id="reset">RESET FILTERS</button>
            <div class="history-panel">
                <h3>History</h3>
                <div id="history-list"></div>
            </div>
        </div>
        <div class="image-container">
            <div class="image-preview">
                <img id="preview-img" src="" alt="Upload an image">
            </div>
            <div class="image-buttons">
                <button id="choose-btn">Choose Image</button>
                <button id="save-btn">Save Image</button>
            </div>
            <input type="file" id="file-input" accept="image/*" hidden>
        </div>
    </div>
</body>
</html>
