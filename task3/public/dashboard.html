<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .card { background: #fff; padding: 2.5rem 3rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); text-align: center; }
    h1 { margin-bottom: 0.5rem; }
    p { color: #555; margin-bottom: 1.5rem; }
    a { display: inline-block; padding: 0.6rem 1.4rem; background: #ef4444; color: #fff; border-radius: 4px; text-decoration: none; }
    a:hover { background: #dc2626; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome!</h1>
    <p>You are logged in.</p>
    <a href="/logout">Logout</a>
  </div>
</body>
</html>
